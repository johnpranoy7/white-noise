# Runs the prebuilt image. To build from source instead, replace `image:` with `build: .`
#   docker compose up -d   →   http://localhost:8080

services:
  whitenoise:
    image: ghcr.io/johnpranoy7/white-noise:latest
    container_name: whitenoise
    restart: unless-stopped
    ports:
      # host:container — change the first number to use a different host port.
      - "8080:8080"
    environment:
      # Sites allowed to embed the app in an <iframe> (CSP frame-ancestors).
      # Example: "'self' https://example.com"
      FRAME_ANCESTORS: "'self'"
    security_opt:
      - no-new-privileges:true
