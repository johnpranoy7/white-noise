name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: white-noise

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Docker Hub is used when the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository
      # secrets are set; GitHub Container Registry is always used.
      - name: Choose registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          images="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            images="$images"$'\n'"docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME is not set; pushing to GHCR only."
          fi
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      # amd64 for a regular server/PC, arm64 for a Raspberry Pi or similar.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: add a DEPLOY_WEBHOOK repository secret (any URL that accepts a POST,
      # such as your container platform's redeploy webhook) to redeploy after each push to main.
      - name: Trigger redeploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK" ]; then
            echo "DEPLOY_WEBHOOK not set; skipping redeploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_WEBHOOK"
